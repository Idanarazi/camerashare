<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#080808">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<title>PicMe</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 2.5px solid #00A8FF; outline-offset: 2px; border-radius: 4px; }

  body {
    background: #080808;
    color: #fff;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 52px 20px 48px;
    overscroll-behavior: none;
    position: relative;
    overflow: hidden;
  }

  /* Ambient top glow */
  body::before {
    content: '';
    position: fixed;
    top: -30%;
    left: 50%;
    transform: translateX(-50%);
    width: 900px;
    height: 900px;
    background: radial-gradient(ellipse at top, rgba(0,168,255,0.10) 0%, transparent 52%);
    pointer-events: none;
    z-index: 0;
  }

  @keyframes fade-up {
    from { opacity: 0; transform: translateY(22px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .page {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 360px;
    gap: 0;
  }

  /* ── Hero ── */
  .hero {
    text-align: center;
    margin-bottom: 36px;
    animation: fade-up 0.6s cubic-bezier(0.22,1,0.36,1) both;
  }

  .logo-mark {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 86px;
    height: 86px;
    background: linear-gradient(145deg, rgba(0,168,255,0.20) 0%, rgba(0,168,255,0.06) 100%);
    border: 1px solid rgba(0,168,255,0.24);
    border-radius: 26px;
    margin-bottom: 20px;
    box-shadow:
      0 0 0 1px rgba(0,168,255,0.08),
      0 0 48px rgba(0,168,255,0.16),
      inset 0 1px 0 rgba(255,255,255,0.07);
  }
  .logo-mark span { font-size: 40px; line-height: 1; }

  h1 {
    font-size: 46px;
    font-weight: 900;
    letter-spacing: -2.5px;
    line-height: 1;
    margin-bottom: 10px;
  }
  h1 .pic { color: #fff; }
  h1 .me  { color: #00A8FF; }

  .tagline {
    font-size: 15px;
    color: rgba(255,255,255,0.40);
    line-height: 1.55;
    letter-spacing: 0.1px;
  }

  /* ── Role group (iOS-style list) ── */
  .role-group {
    width: 100%;
    background: #111111;
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 22px;
    overflow: hidden;
    margin-bottom: 20px;
    animation: fade-up 0.65s 0.07s cubic-bezier(0.22,1,0.36,1) both;
  }

  a.role-card {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 17px 16px;
    text-decoration: none;
    color: #fff;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    transition: background 0.12s;
    cursor: pointer;
    position: relative;
  }
  a.role-card:last-child { border-bottom: none; }
  a.role-card:active { background: rgba(255,255,255,0.05); }

  .role-icon {
    width: 46px;
    height: 46px;
    border-radius: 13px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.07);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    flex-shrink: 0;
  }
  .role-body { flex: 1; min-width: 0; }
  .role-name { font-size: 16px; font-weight: 700; line-height: 1.2; margin-bottom: 2px; }
  .role-desc { font-size: 13px; color: rgba(255,255,255,0.40); line-height: 1.4; }
  .role-chev { font-size: 20px; color: rgba(255,255,255,0.18); flex-shrink: 0; font-weight: 300; }
  a.role-card:active .role-chev { color: #00A8FF; }

  /* ── Bottom ── */
  .bottom {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    animation: fade-up 0.65s 0.13s cubic-bezier(0.22,1,0.36,1) both;
  }

  .wifi-hint {
    font-size: 12px;
    color: rgba(255,255,255,0.28);
    text-align: center;
  }

  #share-app-btn {
    width: 100%;
    background: rgba(0,168,255,0.08);
    border: 1.5px solid rgba(0,168,255,0.20);
    border-radius: 17px;
    color: #00A8FF;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    padding: 16px 22px;
    cursor: pointer;
    touch-action: manipulation;
    transition: background 0.12s, border-color 0.12s, transform 0.1s;
    letter-spacing: 0.1px;
  }
  #share-app-btn:active {
    background: rgba(0,168,255,0.14);
    border-color: rgba(0,168,255,0.38);
    transform: scale(0.97);
  }

  /* ── Toast ── */
  .toast {
    position: fixed;
    bottom: 96px;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: #1E1E1E;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    color: rgba(255,255,255,0.9);
    font-size: 14px;
    font-weight: 600;
    padding: 11px 20px;
    z-index: 300;
    opacity: 0;
    transition: opacity 0.22s, transform 0.22s;
    white-space: nowrap;
    pointer-events: none;
  }
  .toast.toast-show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="page">
  <div class="hero">
    <div class="logo-mark"><span>📷</span></div>
    <h1><span class="pic">Pic</span><span class="me">Me</span></h1>
    <p class="tagline">Stop retaking. Start directing.</p>
  </div>

  <div class="role-group">
    <a href="/photographer.html" class="role-card">
      <div class="role-icon">📷</div>
      <div class="role-body">
        <div class="role-name">Photographer</div>
        <div class="role-desc">Hold the phone. Receive live directions.</div>
      </div>
      <div class="role-chev">›</div>
    </a>
    <a href="/director.html" class="role-card">
      <div class="role-icon">🎬</div>
      <div class="role-body">
        <div class="role-name">Director</div>
        <div class="role-desc">See their view. Guide every angle.</div>
      </div>
      <div class="role-chev">›</div>
    </a>
  </div>

  <div class="bottom">
    <p class="wifi-hint">Works best on the same Wi-Fi network</p>
    <button id="share-app-btn">Share PicMe 🔗</button>
  </div>
</div>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}

document.getElementById('share-app-btn').addEventListener('click', async () => {
  const shareData = {
    title: 'PicMe',
    text: 'Stop retaking. Start directing. Try PicMe — the app that lets someone else frame your perfect shot! 📸',
    url: 'https://camerashare-production.up.railway.app',
  };
  if (navigator.share) {
    try { await navigator.share(shareData); } catch {}
  } else {
    try {
      await navigator.clipboard.writeText(shareData.url);
      showToast('✓ Link copied!');
    } catch {}
  }
});

function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(() => requestAnimationFrame(() => t.classList.add('toast-show')));
  setTimeout(() => {
    t.classList.remove('toast-show');
    setTimeout(() => t.remove(), 250);
  }, 2500);
}
</script>
</body>
</html>
