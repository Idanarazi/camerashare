<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0A0A0A">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<title>CameraShare</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0A0A0A;
    color: #fff;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    gap: 20px;
  }

  .logo-wrap { text-align: center; margin-bottom: 4px; }
  .logo-icon { font-size: 52px; display: block; margin-bottom: 14px; }
  .logo-text { font-size: 34px; font-weight: 800; letter-spacing: -0.5px; line-height: 1; }
  .logo-camera { color: #fff; }
  .logo-share  { color: #00A8FF; }

  .tagline {
    color: rgba(255,255,255,0.4);
    font-size: 15px;
    text-align: center;
    max-width: 270px;
    line-height: 1.65;
    margin-top: -4px;
  }

  a.role-card {
    background: #1A1A1A;
    border: 1.5px solid rgba(255,255,255,0.07);
    border-radius: 22px;
    padding: 24px 22px;
    width: 100%;
    max-width: 340px;
    text-decoration: none;
    color: #fff;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: border-color 0.2s, background 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  a.role-card:active {
    background: #222;
    border-color: rgba(0,168,255,0.4);
  }
  .role-emoji { font-size: 32px; line-height: 1; }
  .role-title { font-size: 20px; font-weight: 700; }
  .role-desc  { font-size: 14px; color: rgba(255,255,255,0.42); line-height: 1.55; }

  .divider { color: rgba(255,255,255,0.18); font-size: 11px; text-transform: uppercase; letter-spacing: 2px; }
  .wifi-hint { color: rgba(255,255,255,0.22); font-size: 12px; text-align: center; letter-spacing: 0.2px; margin-top: -10px; }

  /* ── Share App button ── */
  #share-app-btn {
    background: transparent;
    border: 1.5px solid rgba(0,168,255,0.32);
    border-radius: 16px;
    color: #00A8FF;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    padding: 14px 22px;
    width: 100%;
    max-width: 340px;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
    letter-spacing: 0.1px;
  }
  #share-app-btn:active {
    background: rgba(0,168,255,0.08);
    border-color: rgba(0,168,255,0.6);
    transform: scale(0.97);
  }

  /* ── Toast notification ── */
  .toast {
    position: fixed;
    bottom: 96px;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: #1E1E1E;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    color: rgba(255,255,255,0.9);
    font-size: 14px;
    font-weight: 600;
    padding: 10px 20px;
    z-index: 300;
    opacity: 0;
    transition: opacity 0.22s, transform 0.22s;
    white-space: nowrap;
    pointer-events: none;
  }
  .toast.toast-show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

</style>
</head>
<body>
  <div class="logo-wrap">
    <span class="logo-icon">📷</span>
    <div class="logo-text"><span class="logo-camera">Camera</span><span class="logo-share">Share</span></div>
  </div>

  <p class="tagline">Let someone else frame your perfect shot.</p>
  <p class="wifi-hint">Works best on the same WiFi network</p>

  <a href="/photographer.html" class="role-card">
    <span class="role-emoji">📷</span>
    <div class="role-title">Photographer</div>
    <div class="role-desc">Hold the phone. Stream your camera and receive directions from your Director.</div>
  </a>

  <div class="divider">or</div>

  <a href="/director.html" class="role-card">
    <span class="role-emoji">🎬</span>
    <div class="role-title">Director</div>
    <div class="role-desc">See through their lens. Give directions — angle, zoom, focus — and hit Capture!</div>
  </a>

  <button id="share-app-btn">Share App 🔗</button>


<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}

// ── Share App button ─────────────────────────────────────────────────
document.getElementById('share-app-btn').addEventListener('click', async () => {
  const shareData = {
    title: 'CameraShare',
    text: 'Let someone else frame your perfect shot! Check out CameraShare 📸',
    url: 'https://camerashare-production.up.railway.app',
  };
  if (navigator.share) {
    try { await navigator.share(shareData); } catch {}
  } else {
    try {
      await navigator.clipboard.writeText(shareData.url);
      showToast('✓ Link copied!');
    } catch {}
  }
});

function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(() => requestAnimationFrame(() => t.classList.add('toast-show')));
  setTimeout(() => {
    t.classList.remove('toast-show');
    setTimeout(() => t.remove(), 250);
  }, 2500);
}

</script>
</body>
</html>
